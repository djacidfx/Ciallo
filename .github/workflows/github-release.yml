name: Ciallo Release

# Shared release pipeline. Dispatch workflows create release-like tags and run
# this file; pushing a v* tag by hand does not publish. Steam upload is delegated
# to steam-upload.yml so automated and manual deploys stay identical.
#
# Intentional risk: workflow_dispatch can publish an existing v* tag without the
# release.yml environment gate. The gate prevents mistakes, not malicious writers.

"on":
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
    tags:
      - "ft/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/godot-export.yml
    permissions:
      contents: read
    with:
      checkout_ref: ${{ github.ref }}
      sign_macos: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    if: needs.build.outputs.is_release == 'true'
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: Ciallo-*
          path: packages
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ${{ needs.build.outputs.release_title }}

          - Godot SDK: Godot.NET.Sdk/${{ needs.build.outputs.sdk_version }}
          - Custom engine status: ${{ needs.build.outputs.engine_status }}
          - Custom engine release: ${{ needs.build.outputs.engine_release_tag }}
          - Windows, Linux, and macOS artifacts are exported from the same SDK-locked build.
          - macOS `.app` is signed with Developer ID, notarized by Apple, stapled, and Gatekeeper-verified in CI.
          - Release kind: ${{ needs.build.outputs.tag_kind }}
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          name: ${{ needs.build.outputs.release_title }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          body_path: release-notes.md

      - name: Remove older hotfix prereleases
        if: needs.build.outputs.tag_kind == 'hotfix'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_VERSION: ${{ needs.build.outputs.hotfix_base_version }}
          CURRENT_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          for tag in $(gh release list --repo "$REPO" --limit 100 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease == true and (.tagName | startswith(\"v${BASE_VERSION}-hotfix.\")) and .tagName != \"$CURRENT_TAG\") | .tagName"); do
            echo "Deleting old hotfix GitHub Release: $tag"
            gh release delete "$tag" --repo "$REPO" --yes
          done

  steam:
    name: Push to Steam
    if: >-
      needs.build.outputs.tag_kind == 'rc' ||
      needs.build.outputs.tag_kind == 'release' ||
      needs.build.outputs.tag_kind == 'hotfix'
    needs:
      - build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/steam-upload.yml
    with:
      source_mode: release-tag
      source_label: ${{ github.ref_name }}
      project_version: ${{ needs.build.outputs.project_version }}
      head_sha: ${{ needs.build.outputs.head_sha }}
      tag_kind: ${{ needs.build.outputs.tag_kind }}
      release_title: ${{ needs.build.outputs.release_title }}
      app_id: ${{ vars.STEAM_APP_ID }}
      steam_branch: __auto__
    secrets: inherit
