name: Ciallo Publish RC

# Tags origin/dev as the next v<version>-rc.N and dispatches github-release.yml.
# The dispatch ref picker is ignored; published code always comes from origin/dev.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ciallo-rc-release
  cancel-in-progress: false

env:
  PROJECT_PATH: Ciallo

jobs:
  tag:
    name: Tag and dispatch rc
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create rc tag and dispatch pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin +refs/heads/dev:refs/remotes/origin/dev --tags
          head_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head_sha" origin/dev; then
            echo "Refusing to tag: HEAD $head_sha is not contained in origin/dev."
            exit 1
          fi

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          project_version="$(bash .github/scripts/read-project-version.sh "$PROJECT_PATH")"
          base_tag="v$project_version"

          # rc counter is derived from existing v<version>-rc.N tags.
          last_number="$(
            git tag --list "${base_tag}-rc.*" |
              sed -E "s/^${base_tag}-rc\.([0-9]+)$/\1/" |
              sort -n |
              tail -n 1
          )"
          if [ -z "$last_number" ]; then
            next_number=1
          else
            next_number=$((last_number + 1))
          fi

          rc_tag="${base_tag}-rc.${next_number}"
          if git rev-parse -q --verify "refs/tags/$rc_tag" >/dev/null; then
            echo "Tag $rc_tag already exists; refusing to overwrite."
            exit 1
          fi

          git tag -a "$rc_tag" "$head_sha" -m "Ciallo ${rc_tag#v}"
          git push origin "$rc_tag"

          gh workflow run github-release.yml --repo "$REPO" --ref "$rc_tag"
          echo "Created $rc_tag from origin/dev@$head_sha and dispatched the release pipeline."
