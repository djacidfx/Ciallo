name: Godot Export

# Export pipeline: validates project/SDK metadata and exports the
# Windows/Linux/macOS builds. Shared by github-release.yml (release
# automation) and steam-deploy.yml (manual Steam upload).
#
# KEY POINTS (this file replaced the inline meta+export jobs of
# github-release.yml when Steam upload was added):
# - Tag semantics are derived from `checkout_ref`, NOT github.ref_name.
#   In a workflow_call context github.ref_name / github.ref_type describe the
#   CALLER's ref, so relying on them would validate the wrong commit. The
#   release caller passes github.ref; the Steam caller passes a manual
#   branch/tag/SHA.
# - A checkout_ref that is a release-like tag keeps the full tag rules
#   (rc must be on dev; hotfix must be on main and target latest stable;
#   release must be on main). A branch or SHA only has to build and is never
#   treated as a release.
# - Artifacts (Ciallo-Windows/Linux/macOS) are the raw exported files.
#   actions/upload-artifact strips the Unix executable bit, so ANY consumer
#   that runs the binaries (GitHub Release zip packaging, Steam depot staging)
#   MUST re-chmod +x after download. See the chmod steps in the callers.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to checkout and build (full ref like refs/tags/vX, or a bare tag/branch/SHA).
        required: true
        type: string
    outputs:
      project_name:
        value: ${{ jobs.meta.outputs.project_name }}
      project_version:
        value: ${{ jobs.meta.outputs.project_version }}
      head_sha:
        value: ${{ jobs.meta.outputs.head_sha }}
      engine_status:
        value: ${{ jobs.meta.outputs.engine_status }}
      engine_release_tag:
        value: ${{ jobs.meta.outputs.engine_release_tag }}
      sdk_version:
        value: ${{ jobs.meta.outputs.sdk_version }}
      tag_kind:
        value: ${{ jobs.meta.outputs.tag_kind }}
      is_release:
        value: ${{ jobs.meta.outputs.is_release }}
      is_prerelease:
        value: ${{ jobs.meta.outputs.is_prerelease }}
      release_title:
        value: ${{ jobs.meta.outputs.release_title }}
      hotfix_base_version:
        value: ${{ jobs.meta.outputs.hotfix_base_version }}

permissions:
  contents: read

env:
  PROJECT_PATH: Ciallo
  CSPROJ: Ciallo/Ciallo.csproj
  EXPORT_NAME: Ciallo
  GODOT_FEED: https://shenciao.github.io/godot/index.json
  GODOT_SDK_FLAT: https://shenciao.github.io/godot/flatcontainer/godot.net.sdk/index.json
  GODOT_RELEASE_REPO: ShenCiao/godot
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  meta:
    name: Validate version and SDK
    runs-on: ubuntu-24.04
    outputs:
      artifact_retention_days: ${{ steps.meta.outputs.artifact_retention_days }}
      engine_release_tag: ${{ steps.meta.outputs.engine_release_tag }}
      engine_status: ${{ steps.meta.outputs.engine_status }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      hotfix_base_version: ${{ steps.meta.outputs.hotfix_base_version }}
      is_release: ${{ steps.meta.outputs.is_release }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      project_name: ${{ steps.meta.outputs.project_name }}
      release_title: ${{ steps.meta.outputs.release_title }}
      project_version: ${{ steps.meta.outputs.project_version }}
      sdk_version: ${{ steps.meta.outputs.sdk_version }}
      tag_kind: ${{ steps.meta.outputs.tag_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          lfs: true
          submodules: true

      - name: Validate metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Read-GodotSetting([string]$Path, [string]$Key) {
            $line = Get-Content -LiteralPath $Path | Where-Object { $_ -match "^$([regex]::Escape($Key))=" } | Select-Object -First 1
            if (-not $line) {
              throw "Missing setting '$Key' in $Path"
            }
            $value = $line.Substring($line.IndexOf("=") + 1).Trim()
            if ($value.StartsWith('"') -and $value.EndsWith('"')) {
              $value = $value.Substring(1, $value.Length - 2)
            }
            return $value
          }

          $projectFile = Join-Path $env:PROJECT_PATH "project.godot"
          $projectName = Read-GodotSetting $projectFile "config/name"
          $projectVersion = Read-GodotSetting $projectFile "config/version"
          if ($projectVersion -notmatch "^\d+\.\d+\.\d+$") {
            throw "project.godot config/version must be plain semver X.Y.Z. Actual: $projectVersion"
          }

          [xml]$csproj = Get-Content -LiteralPath $env:CSPROJ
          $sdk = $csproj.Project.Sdk
          if ($sdk -notmatch "^Godot\.NET\.Sdk/(?<version>\d+\.\d+\.\d+-ciallo\.g(?<sha>[0-9a-f]+))$") {
            throw "C# project must use published custom Godot SDK: Godot.NET.Sdk/<semver>-ciallo.g<sha>. Actual: $sdk"
          }

          $sdkVersion = $Matches.version
          $engineStatus = "ciallo.g$($Matches.sha)"

          $sdkIndex = Invoke-RestMethod -Uri $env:GODOT_SDK_FLAT
          if ($sdkIndex.versions -notcontains $sdkVersion) {
            throw "SDK '$sdkVersion' is not published on public feed '$env:GODOT_SDK_FLAT'."
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            Authorization = "Bearer $env:GH_TOKEN"
          }
          $templateAsset = "godot-export-templates-$engineStatus.tpz"
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GODOT_RELEASE_REPO/releases?per_page=100" -Headers $headers
          $engineRelease = $releases | Where-Object { $_.assets.name -contains $templateAsset } | Select-Object -First 1
          if (-not $engineRelease) {
            throw "Could not find a $env:GODOT_RELEASE_REPO release containing '$templateAsset'."
          }
          $engineReleaseTag = $engineRelease.tag_name

          $headSha = (git rev-parse HEAD).Trim()

          $tagKind = "branch"
          $hotfixBaseVersion = ""
          $isRelease = "false"
          $isPrerelease = "false"
          $releaseTitle = "$projectName $projectVersion"
          $retention = "2"

          # Derive tag-ness from checkout_ref, not github.ref_name (which in a
          # workflow_call run points at the caller, not the built commit).
          #   refs/tags/*  -> a real pushed tag; validate against tag patterns.
          #   refs/*       -> branch or PR merge ref; build only, never a release.
          #   bare value   -> manual Steam dispatch; treat as a release tag only
          #                   when it matches a known tag pattern, else build only.
          $checkoutRef = $env:CHECKOUT_REF
          $refName = $checkoutRef
          $treatAsTag = $false
          if ($checkoutRef.StartsWith("refs/tags/")) {
            $treatAsTag = $true
            $refName = $checkoutRef.Substring("refs/tags/".Length)
          } elseif ($checkoutRef.StartsWith("refs/")) {
            $treatAsTag = $false
          } elseif ($checkoutRef -match "^ft/[^/]+\.\d+$" -or $checkoutRef -match "^v\d+\.\d+\.\d+(-(rc|hotfix)\.\d+)?$") {
            $treatAsTag = $true
            $refName = $checkoutRef
          }

          if ($treatAsTag) {
            if ($refName -match "^ft/[^/]+\.\d+$") {
              $tagKind = "feature-test"
              $retention = "2"
            } elseif ($refName -match "^v(?<version>\d+\.\d+\.\d+)-rc\.\d+$") {
              if ($Matches.version -ne $projectVersion) {
                throw "RC tag version '$($Matches.version)' must match project.godot config/version '$projectVersion'."
              }
              git merge-base --is-ancestor HEAD origin/dev
              if ($LASTEXITCODE -ne 0) {
                throw "RC tag '$refName' must point to a commit contained in origin/dev."
              }
              $tagKind = "rc"
              $isRelease = "true"
              $isPrerelease = "true"
              $releaseTitle = "$projectName $refName"
              $retention = "30"
            } elseif ($refName -match "^v(?<version>\d+\.\d+\.\d+)-hotfix\.(?<number>[1-9]\d*)$") {
              $hotfixVersion = $Matches.version
              $hotfixTag = "v$hotfixVersion"
              if ($hotfixVersion -ne $projectVersion) {
                throw "Hotfix tag base version '$hotfixVersion' must match project.godot config/version '$projectVersion'. Do not write the hotfix suffix into project.godot."
              }
              git merge-base --is-ancestor HEAD origin/main
              if ($LASTEXITCODE -ne 0) {
                throw "Hotfix tag '$refName' must point to a commit contained in origin/main."
              }
              $latestStable = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Headers $headers
              if ($latestStable.tag_name -ne $hotfixTag) {
                throw "Hotfix tag '$refName' is only allowed for the latest stable release. Latest stable: '$($latestStable.tag_name)'."
              }
              $tagKind = "hotfix"
              $hotfixBaseVersion = $hotfixVersion
              $isRelease = "true"
              $isPrerelease = "true"
              $releaseTitle = "$projectName $refName"
              $retention = "30"
            } elseif ($refName -match "^v(?<version>\d+\.\d+\.\d+)$") {
              if ($Matches.version -ne $projectVersion) {
                throw "Release tag version '$($Matches.version)' must match project.godot config/version '$projectVersion'."
              }
              git merge-base --is-ancestor HEAD origin/main
              if ($LASTEXITCODE -ne 0) {
                throw "Release tag '$refName' must point to a commit contained in origin/main."
              }
              $tagKind = "release"
              $isRelease = "true"
              $isPrerelease = "false"
              $releaseTitle = "$projectName $refName"
              $retention = "30"
            } else {
              throw "Unsupported tag '$refName'. Use ft/<slug>.<N>, vX.Y.Z-rc.N, vX.Y.Z-hotfix.N, or vX.Y.Z."
            }
          }

          "artifact_retention_days=$retention" >> $env:GITHUB_OUTPUT
          "engine_release_tag=$engineReleaseTag" >> $env:GITHUB_OUTPUT
          "engine_status=$engineStatus" >> $env:GITHUB_OUTPUT
          "head_sha=$headSha" >> $env:GITHUB_OUTPUT
          "hotfix_base_version=$hotfixBaseVersion" >> $env:GITHUB_OUTPUT
          "is_release=$isRelease" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "project_name=$projectName" >> $env:GITHUB_OUTPUT
          "release_title=$releaseTitle" >> $env:GITHUB_OUTPUT
          "project_version=$projectVersion" >> $env:GITHUB_OUTPUT
          "sdk_version=$sdkVersion" >> $env:GITHUB_OUTPUT
          "tag_kind=$tagKind" >> $env:GITHUB_OUTPUT

          "Project: $projectName $projectVersion"
          "Commit: $headSha"
          "Godot SDK: $sdkVersion"
          "Engine status: $engineStatus"
          "Engine release: $engineReleaseTag"
          "Checkout ref: $checkoutRef"
          "Tag kind: $tagKind"

  export:
    name: Export ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            editor_asset: godot-windows-x86_64
            editor_glob: godot*.exe
            preset: Windows Desktop
            output_dir: build/windows
            output_file: Ciallo.exe
            artifact: Ciallo-Windows
          - name: Linux
            runner: ubuntu-24.04
            editor_asset: godot-linuxbsd-x86_64
            editor_glob: godot*
            preset: Linux
            output_dir: build/linux
            output_file: Ciallo
            artifact: Ciallo-Linux
          - name: macOS
            runner: macos-26
            editor_asset: godot-macos-arm64
            editor_glob: godot*
            preset: macOS
            output_dir: build/macos
            output_file: Ciallo.app
            artifact: Ciallo-macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}
          lfs: true
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download custom Godot editor and templates
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RELEASE_TAG: ${{ needs.meta.outputs.engine_release_tag }}
          ENGINE_STATUS: ${{ needs.meta.outputs.engine_status }}
          EDITOR_ASSET: ${{ matrix.editor_asset }}
          RELEASE_REPO: ${{ env.GODOT_RELEASE_REPO }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .godot-ci | Out-Null

          $editorArchive = "$env:EDITOR_ASSET-$env:ENGINE_STATUS.zip"
          $templateArchive = "godot-export-templates-$env:ENGINE_STATUS.tpz"

          gh release download $env:ENGINE_RELEASE_TAG --repo $env:RELEASE_REPO --pattern $editorArchive --dir .godot-ci
          gh release download $env:ENGINE_RELEASE_TAG --repo $env:RELEASE_REPO --pattern $templateArchive --dir .godot-ci

          Expand-Archive -LiteralPath ".godot-ci/$editorArchive" -DestinationPath .godot-ci/editor -Force
          New-Item -ItemType Directory -Force -Path .godot-ci/templates_src | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory(
            (Resolve-Path ".godot-ci/$templateArchive").Path,
            (Resolve-Path ".godot-ci/templates_src").Path
          )

      - name: Install export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionFile = Get-ChildItem -LiteralPath .godot-ci/templates_src -Recurse -Filter version.txt | Select-Object -First 1
          if (-not $versionFile) {
            throw "Export template version.txt was not found."
          }

          $templateVersion = (Get-Content -LiteralPath $versionFile.FullName -Raw).Trim()
          $templateDir = Split-Path -Parent $versionFile.FullName

          if ($IsWindows) {
            $dest = Join-Path $env:APPDATA "Godot/export_templates/$templateVersion"
          } elseif ($IsMacOS) {
            $dest = Join-Path $HOME "Library/Application Support/Godot/export_templates/$templateVersion"
          } else {
            $dest = Join-Path $HOME ".local/share/godot/export_templates/$templateVersion"
          }

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $templateDir "*") -Destination $dest -Recurse -Force
          "Installed export templates to $dest"

      - name: Locate editor
        id: editor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidate = Get-ChildItem -LiteralPath .godot-ci/editor -Recurse -File -Filter "${{ matrix.editor_glob }}" |
            Where-Object {
              $_.Name -notmatch '\.(pdb|lib|exp)$' -and
              $_.FullName -notmatch '\.app[\\/]' -and
              $_.Name -notmatch 'console'
            } |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $candidate) {
            throw "Could not locate Godot editor binary in .godot-ci/editor."
          }

          if (-not $IsWindows) {
            chmod +x $candidate.FullName
          }

          "path=$($candidate.FullName)" >> $env:GITHUB_OUTPUT
          "Editor: $($candidate.FullName)"

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:CSPROJ" --configfile NuGet.Config

      - name: Validate localization CSV
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = @'
          import csv
          import pathlib
          import sys

          failed = False
          for path in sorted(pathlib.Path("Ciallo/Localization").glob("*.csv")):
              with path.open("r", encoding="utf-8-sig", newline="") as stream:
                  rows = list(csv.reader(stream))

              expected_width = len(rows[0])
              for row_number, row in enumerate(rows, start=1):
                  if len(row) != expected_width:
                      print(
                          f"{path}:{row_number}: expected {expected_width} columns, got {len(row)}",
                          file=sys.stderr,
                      )
                      failed = True

          if failed:
              sys.exit(1)
          '@
          $script | python -

      - name: Import resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Filter expected first-scan noise before Godot finishes importing resources.
          $noise = "res://Localization/.+\.translation|resource_format_binary\.cpp:1220|resource_loader\.cpp:343|Failed to create an autoload, script 'res://.+\.cs' is not compiling|_create_autoload \(editor/settings/editor_autoload_settings\.cpp:409\)"
          Push-Location $env:PROJECT_PATH
          & "${{ steps.editor.outputs.path }}" --headless --import 2>&1 |
            Where-Object { $_ -notmatch $noise }
          $importExitCode = $LASTEXITCODE
          Pop-Location

          if ($importExitCode -ne 0) {
            throw "Godot resource import failed with exit code $importExitCode."
          }

      - name: Export release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = Join-Path (Get-Location) "${{ matrix.output_dir }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outFile = Join-Path $outDir "${{ matrix.output_file }}"
          # Filter expected C# autoload first-scan noise before Godot publishes .NET.
          $noise = "Failed to create an autoload, script 'res://.+\.cs' is not compiling|_create_autoload \(editor/settings/editor_autoload_settings\.cpp:409\)"

          Push-Location $env:PROJECT_PATH
          & "${{ steps.editor.outputs.path }}" --headless --export-release "${{ matrix.preset }}" $outFile 2>&1 |
            Where-Object { $_ -notmatch $noise }
          $exportExitCode = $LASTEXITCODE
          Pop-Location

          if ($exportExitCode -ne 0) {
            throw "Godot export failed with exit code $exportExitCode."
          }
          if (-not (Test-Path -LiteralPath $outFile)) {
            throw "Export did not create expected output: $outFile"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output_dir }}/*
          retention-days: ${{ needs.meta.outputs.artifact_retention_days }}
          if-no-files-found: error
