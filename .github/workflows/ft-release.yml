name: Ciallo Publish Feature Test

# Tags the dispatched branch as ft/<slug>.N and dispatches github-release.yml.
# Feature-test runs produce short-lived artifacts only: no GitHub Release, no Steam.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ciallo-ft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and dispatch feature test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dispatched branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create feature-test tag and dispatch pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          # Branch name -> lowercase dash slug.
          slug="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$slug" ]; then
            echo "Could not derive a slug from branch name '$BRANCH'."
            exit 1
          fi

          # Counter comes from existing ft/<slug>.N tags.
          last_number="$(
            git tag --list "ft/${slug}.*" |
              sed -E "s#^ft/${slug}\.([0-9]+)\$#\1#" |
              sort -n |
              tail -n 1
          )"
          if [ -z "$last_number" ]; then
            next_number=1
          else
            next_number=$((last_number + 1))
          fi

          ft_tag="ft/${slug}.${next_number}"
          if git rev-parse -q --verify "refs/tags/$ft_tag" >/dev/null; then
            echo "Tag $ft_tag already exists; refusing to overwrite."
            exit 1
          fi

          git tag -a "$ft_tag" "$head_sha" -m "Ciallo feature test ${slug}.${next_number}"
          git push origin "$ft_tag"

          gh workflow run github-release.yml --repo "$REPO" --ref "$ft_tag"
          echo "Created $ft_tag from $BRANCH@$head_sha and dispatched the pipeline."
