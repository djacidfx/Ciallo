name: Ciallo Publish Release

# Gated workflow that tags origin/main as v<version> and dispatches github-release.yml.
# The dispatch ref picker is ignored; published code always comes from origin/main.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ciallo-release
  cancel-in-progress: false

env:
  PROJECT_PATH: Ciallo

jobs:
  tag:
    name: Tag and dispatch release
    runs-on: ubuntu-24.04
    # Enforces publish permission: run pauses here for a required reviewer.
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create release tag and dispatch pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          head_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head_sha" origin/main; then
            echo "Refusing to tag: HEAD $head_sha is not contained in origin/main."
            exit 1
          fi

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          project_version="$(bash .github/scripts/read-project-version.sh "$PROJECT_PATH")"
          release_tag="v$project_version"
          # Same-version publish force-moves the tag and updates the release.
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            echo "Tag $release_tag already exists; moving it to $head_sha (overwriting the previous $release_tag)."
          fi

          git tag -f -a "$release_tag" "$head_sha" -m "Ciallo ${release_tag#v}"
          git push -f origin "refs/tags/$release_tag"

          gh workflow run github-release.yml --repo "$REPO" --ref "$release_tag"
          echo "Published $release_tag at origin/main@$head_sha and dispatched the release pipeline."
